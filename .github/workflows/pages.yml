# Build Jekyll site, prerender with Playwright (KaTeX + JS), then deploy to GitHub Pages.
# In repo Settings → Pages, set "Source: GitHub Actions".

name: Build and deploy Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm install

      # Prerendered HTML from previous runs, keyed by page content. Restoring the
      # newest one lets the prerender step reuse every page the build did not
      # change. The key is unique per commit so each run saves a fresh entry;
      # restore-keys falls back to the most recent one.
      - name: Restore prerender cache
        uses: actions/cache@v4
        with:
          path: .prerender-cache
          key: prerender-${{ github.sha }}
          restore-keys: prerender-

      # Chromium costs ~30s to install and is useless when the cache already
      # covers every page — a commit that touches only docs, CI or an
      # un-whitelisted file, or one that restores an earlier state.
      - name: Check what needs prerendering
        id: plan
        env:
          PRERENDER_DRY_RUN: "1"
        run: npm run prerender

      - name: Install Playwright browsers
        if: steps.plan.outputs.pending != '0'
        run: npx playwright install --with-deps chromium

      - name: Prerender (KaTeX + JS)
        run: npm run prerender

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github_pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
