title: "یادداشت‌های فرکتالی"
# Kept short on purpose: jekyll-seo-tag builds the home page's <title> as
# "{{ site.title }} | {{ site.description }}", and Google truncates around 60
# characters. The long, keyword-rich version lives in index.md's front matter,
# where it serves as the home page's meta description instead.
description: "ریاضی به زبان فارسی؛ کوتاه و شهودی"
url: "https://fractalnotes.com"
baseurl: ""
repository: pooyarezaie/Fractal-Notes
lang: "fa"
locale: "fa_IR"
logo: "/assets/img/logo.png"
image: "/assets/img/logo_small.png"

author:
  name: "Pooya Rezaie"
  twitter: "FractalNotes"

# Keep internal docs, build tooling and licenses out of the published site
# (github-pages' optional-front-matter plugin would otherwise publish every .md).
# NOTE: setting `exclude` replaces Jekyll's defaults, so list those too.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - PROJECT_NOTES.md
  - LICENSE
  - Makefile
  - Dockerfile
  - compose.yml
  - deploy/
  - scripts/
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/

twitter:
  username: "FractalNotes"
  # The notes' figures are wide charts and diagrams; "summary" would crop them
  # into an unreadable square thumbnail.
  card: "summary_large_image"

social:
  name: "Fractal Notes"
  links:
    - "https://fractalnotes.com"
    - "https://x.com/FractalNotes"
    - "https://t.me/FractalNotes"

# The github-pages gem enables jekyll-theme-primer by default. This site has its
# own layout and stylesheet and uses nothing from it, and the theme's
# assets/css/style.scss fights our own stylesheet for the same output path.
theme:

# Notes live at /topic/name/ rather than /topic/name.html, so the URL a page is
# linked by, the one it declares canonical, and the one in sitemap.xml are all the
# same string. Without this, jekyll-seo-tag and jekyll-sitemap emit the .html form
# while every link in the templates points at the extensionless one.
permalink: pretty

markdown: kramdown
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  # Notes moved from /topic/name.html to /topic/name/ (see `permalink` above).
  # GitHub Pages serves static files only, so the old URLs cannot 301; instead
  # every note that predates the move carries `redirect_from` in its front
  # matter, and this emits a stub there with a canonical link and a meta
  # refresh. Google reads that as a permanent redirect and carries the old
  # URL's history over. New notes never lived at a .html URL and need nothing.
  - jekyll-redirect-from

defaults:
  -
    scope:
      path: ""
    values:
      layout: default
      image: "/assets/img/logo_small.png"
