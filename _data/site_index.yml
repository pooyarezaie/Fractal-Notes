# Grouped index for the homepage and the side menu. Single source of truth.
#
# Each top-level entry is a topic group:
#   title    group heading (Persian)
#   path     optional landing page for the group (no leading slash, no .md)
#   series   optional; true = an ordered mini-course. Its notes are numbered and
#            get automatic «برگهٔ پیشین / برگهٔ بعدی» navigation. The Persian UI
#            never says «دوره» or «درس» — the reader just sees numbered برگه‌ها.
#   summary  optional one-line blurb shown on the homepage
#   items    the notes of the group, in reading order:
#              title    short title, WITHOUT the topic prefix (the group supplies it)
#              path     no leading slash, no .md
#              summary  optional one-line blurb (shown on the group landing page)
#
# A note that is not listed here is invisible on the site.

- title: "اعداد مختلط"
  path: "complex-numbers"
  series: true
  summary: "پنج برگهٔ پشت سر هم: از این پرسش که «ضربِ دو بردار یعنی چه؟» تا حسابِ کاملِ اعداد مختلط — همه با یک تصویر هندسیِ واحد."
  items:
    - title: "آشنایی کوتاه با اعداد مختلط"
      path: "complex-numbers/introduction"
      summary: "همه‌چیز از یک پرسش شروع می‌شود: دو نقطهٔ صفحه را چطور در هم ضرب کنیم؟ پاسخِ طبیعیِ این پرسش، معنای واقعیِ $i$ را هم روشن می‌کند."
    - title: "از هندسه تا جبر"
      path: "complex-numbers/from-geometry-to-algebra"
      summary: "چرا اجازه داریم $x + yi$ را مثل جبرِ معمولی ضرب کنیم و پرانتزها را باز کنیم؟ پلی میان تصویر هندسی و نمادِ آشنای مدرسه — با یک هدیهٔ مثلثاتی در پایان."
    - title: "توان‌ها و ریشه‌های واحد"
      path: "complex-numbers/roots-of-unity"
      summary: "اگر عددی را بارها در خودش ضرب کنیم چه پیش می‌آید؟ و کدام اعدادند که پس از $n$ بار ضرب به ۱ می‌رسند؟ جوابِ دوم شکلی دارد که انتظارش را ندارید."
    - title: "ریشه‌های یک عدد دلخواه"
      path: "complex-numbers/nth-roots"
      summary: "حالا معادلهٔ کامل: $z^n = w$ برای هر عدد دلخواه. معلوم می‌شود در صفحهٔ مختلط هیچ عدد ناصفری «بی‌ریشه» نیست — و همهٔ ریشه‌ها با یک حرکت از دلِ هم بیرون می‌آیند."
    - title: "مزدوج، قدر مطلق و تقسیم"
      path: "complex-numbers/conjugate-and-division"
      summary: "قطعهٔ آخرِ حساب: تقسیم. سرِ راه با مزدوج آشنا می‌شویم و سرانجام می‌فهمیم ترفندِ مشهورِ «ضرب در مزدوجِ مخرج» چرا کار می‌کند."

