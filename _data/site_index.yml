# Grouped index for the homepage and the side menu. Single source of truth.
#
# Each top-level entry is a topic group:
#   title    group heading (Persian)
#   path     optional landing page for the group (no leading slash, no .md)
#   series   optional; true = an ordered mini-course. Its notes are numbered and
#            get automatic «previous lesson / next lesson» navigation.
#   summary  optional one-line blurb shown on the homepage
#   items    the notes of the group, in reading order:
#              title    short title, WITHOUT the topic prefix (the group supplies it)
#              path     no leading slash, no .md
#              summary  optional one-line blurb (shown on the group landing page)
#
# A note that is not listed here is invisible on the site.

- title: "اعداد مختلط"
  path: "complex-numbers"
  series: true
  summary: "یک دورهٔ کوتاه در پنج درس: از این پرسش که «ضربِ دو بردار یعنی چه؟» تا حسابِ کاملِ اعداد مختلط — همه با یک تصویر هندسیِ واحد."
  items:
    - title: "آشنایی کوتاه با اعداد مختلط"
      path: "complex-numbers/introduction"
      summary: "عدد را از محور حقیقی بیرون می‌آوریم و به تمام صفحه می‌بریم: جمع یعنی جمعِ برداری، ضرب یعنی دوران و کشش — و از همین‌جا معنای عدد موهومی روشن می‌شود."
    - title: "از هندسه تا جبر"
      path: "complex-numbers/from-geometry-to-algebra"
      summary: "پلی میان تصویر هندسی و نمادِ آشنای $x + yi$؛ قاعدهٔ جبریِ ضرب از دل هندسه بیرون می‌آید و اتحادهای جمعِ زاویه‌ها را رایگان به ما می‌دهد."
    - title: "توان‌ها و ریشه‌های واحد"
      path: "complex-numbers/roots-of-unity"
      summary: "وقتی ضرب دوران است، توان‌رساندن یعنی قدم‌زدن روی دایره: فرمول دموآور، ریشه‌های واحد به‌شکل یک چندضلعی منتظم، و چراییِ صفر بودنِ جمعشان."
    - title: "ریشه‌های یک عدد دلخواه"
      path: "complex-numbers/nth-roots"
      summary: "معادلهٔ $z^n = w$ را کامل حل می‌کنیم: هر عدد مختلط ناصفر دقیقاً $n$ ریشهٔ $n$-اُم دارد — همان چندضلعیِ ریشه‌های واحد، چرخیده و کش‌آمده."
    - title: "مزدوج، قدر مطلق و تقسیم"
      path: "complex-numbers/conjugate-and-division"
      summary: "آخرین قطعهٔ حساب: مزدوج به‌عنوان بازتاب در آینهٔ محور حقیقی، معنای هندسیِ تقسیم، و دلیلِ واقعیِ ترفندِ «ضرب در مزدوجِ مخرج»."

