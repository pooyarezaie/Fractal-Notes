# Grouped index for the homepage and the side menu. Single source of truth.
#
# Each top-level entry is a topic group:
#   title    group heading (Persian)
#   path     optional landing page for the group (no leading slash, no .md)
#   series   optional; true = an ordered mini-course. Its notes are numbered and
#            get automatic «برگهٔ پیشین / برگهٔ بعدی» navigation. The Persian UI
#            never says «دوره» or «درس» — the reader just sees numbered برگه‌ها.
#   summary  optional one-line blurb shown on the homepage
#   items    the notes of the group, in reading order:
#              title    short title, WITHOUT the topic prefix (the group supplies it)
#              path     no leading slash, no .md
#              summary  optional one-line blurb (shown on the group landing page)
#
# A note that is not listed here is invisible on the site.

- title: "اعداد مختلط"
  path: "complex-numbers"
  series: true
  summary: "هشت برگهٔ پشت سر هم: از این پرسش که «ضربِ دو بردار یعنی چه؟» تا حسابِ کاملِ اعداد مختلط — و در پایان، دیداری با فراکتال‌ها."
  items:
    - title: "آشنایی کوتاه با اعداد مختلط"
      path: "complex-numbers/introduction"
      summary: "همه‌چیز از یک پرسش شروع می‌شود: دو نقطهٔ صفحه را چطور در هم ضرب کنیم؟ پاسخِ طبیعیِ این پرسش، معنای واقعیِ $i$ را هم روشن می‌کند."
    - title: "از هندسه تا جبر"
      path: "complex-numbers/from-geometry-to-algebra"
      summary: "چرا اجازه داریم $x + yi$ را مثل جبرِ معمولی ضرب کنیم و پرانتزها را باز کنیم؟ پلی میان تصویر هندسی و نمادِ آشنای مدرسه؛ و در پایان: آیا واقعاً دستگاه عددی ساخته‌ایم؟"
    - title: "اندازه، آرگومان و صورت قطبی"
      path: "complex-numbers/polar-form"
      summary: "هر عدد مختلط دو نشانی دارد: دکارتی و قطبی. رفت‌وآمد میان این دو، مهارتی است با یک دامِ مشهور — و در پایان، هدیه‌ای مثلثاتی که حفظ‌کردنش همیشه دردسر بود."
    - title: "توان‌ها و ریشه‌های واحد"
      path: "complex-numbers/roots-of-unity"
      summary: "اگر عددی را بارها در خودش ضرب کنیم چه پیش می‌آید؟ و کدام اعدادند که پس از $n$ بار ضرب به ۱ می‌رسند؟ جوابِ دوم شکلی دارد که انتظارش را ندارید."
    - title: "ریشه‌های یک عدد دلخواه"
      path: "complex-numbers/nth-roots"
      summary: "حالا معادلهٔ کامل: $z^n = w$ برای هر عدد دلخواه. معلوم می‌شود در صفحهٔ مختلط هیچ عدد ناصفری «بی‌ریشه» نیست — و همهٔ ریشه‌ها با یک حرکت از دلِ هم بیرون می‌آیند."
    - title: "مزدوج، قدر مطلق و تقسیم"
      path: "complex-numbers/conjugate-and-division"
      summary: "قطعهٔ آخرِ حساب: تقسیم. سرِ راه با مزدوج آشنا می‌شویم و سرانجام می‌فهمیم ترفندِ مشهورِ «ضرب در مزدوجِ مخرج» چرا کار می‌کند."
    - title: "تبدیل‌ها، فاصله و مکان‌های هندسی"
      path: "complex-numbers/transformations-and-loci"
      summary: "حساب که کامل شد، به کارش می‌اندازیم: ضرب و جمع را به چشم تبدیل‌های صفحه ببینید، فاصله را به زبان قدر مطلق بنویسید — و تماشا کنید که معادله‌ها یکی‌یکی شکل می‌شوند."
    - title: "از z² + c تا ژولیا و ماندلبرو"
      path: "complex-numbers/julia-mandelbrot"
      summary: "قاعده‌ای یک‌خطی و تکرار، فقط تکرار. از دلِ این بازیِ ساده مرزی بیرون می‌آید که هرچه نزدیک‌تر شوید، تازه اولِ ماجراست."

- title: "چگونه با آمار دروغ بگوییم؟"
  path: "how-to-lie-with-statistics"
  series: true
  summary: "سفری برگه‌به‌برگه در کتاب کلاسیک دارل هاف: عددها چگونه بی‌آن‌که جعل شوند دروغ می‌گویند — و ما با چند پرسش ساده چگونه دستشان را رو کنیم؛ با مثال‌هایی از آمریکای قرن بیستم تا ایران امروز."
  items:
    - title: "نمونه‌ی بد!"
      path: "how-to-lie-with-statistics/sample-with-built-in-bias"
      summary: "مجله‌ای نوشت میانگین درآمد فارغ‌التحصیلان Yale سالی ۲۵٬۱۱۱ دلار است. عدد تا دلارِ آخر دقیق است — و درست همین‌جاست که باید شک کرد. و ماجرای نظرسنجی‌ای با ده میلیون پرسش‌نامه که جوابش اشتباه از آب درآمد."
    - title: "میانگینِ دست‌چین‌شده!"
      path: "how-to-lie-with-statistics/the-well-chosen-average"
      summary: "یک محله، دو درآمد متوسط: ۱۵ هزار دلار و ۳۵۰۰ دلار — هر دو از همان داده‌ها و هیچ‌کدام دروغ. و ماجرای نیروی هوایی آمریکا که به جست‌وجوی «خلبان متوسط» رفت تا کابین را برای او بسازد."

